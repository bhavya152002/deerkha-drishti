# Shared proxy headers. Install to /etc/nginx/deerkha-proxy.conf.
#
# X-Forwarded-For and X-Forwarded-Proto are not cosmetic here: uvicorn runs with
# --proxy-headers --forwarded-allow-ips='127.0.0.1', and the application's
# per-IP login rate limiting and audit logging both read the client address. Without
# these, every request appears to come from 127.0.0.1 and per-IP limits become
# a single shared bucket for the entire internet.

proxy_http_version 1.1;
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header Upgrade           $http_upgrade;
proxy_set_header Connection        $connection_upgrade;

proxy_connect_timeout 10s;

# proxy_send_timeout / proxy_read_timeout are DELIBERATELY NOT SET HERE.
#
# A directive may appear only once per context. Setting the read timeout in this
# include means any location that includes it AND needs a different value -- the
# MJPEG stream location, which must hold a connection open for an hour -- gets
# "proxy_read_timeout directive is duplicate" and nginx refuses to start. That
# also breaks `certbot --nginx`, which shells out to `nginx -t` and reports it as
# a plugin failure rather than a config error.
#
# They are set at SERVER level in nginx-deerkha.conf instead, so a location can
# legally override them.
