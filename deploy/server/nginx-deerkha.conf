# nginx for Deerkha Drishti. Install to /etc/nginx/sites-available/deerkha,
# symlink into sites-enabled, then:
#     sudo certbot --nginx -d admin.example.com -d app.example.com
#     sudo nginx -t && sudo systemctl reload nginx
#     sudo ufw allow 'Nginx Full'
#
# TWO HOSTNAMES, one app:
#   admin.<domain>  -- full dashboard. Internal team only.
#   app.<domain>    -- read-only client dashboard. Internet-facing, customers.
#
# Both proxy to the same uvicorn on 127.0.0.1:8000, and the application's own
# role checks are the REAL access control. The per-host denies below are
# defence in depth: they make a future forgotten admin route unreachable from
# the customer's hostname even if its guard is wrong. Two locks, not one.
#
# After installing, verify the app is not reachable except through nginx:
#     curl --connect-timeout 5 http://<public-ip>:8000/healthz    # must TIME OUT

# Rate limit the login form. Per-IP only -- the per-username lockout lives in
# the application, because a botnet rotating source IPs walks straight past
# anything keyed on $binary_remote_addr.
limit_req_zone $binary_remote_addr zone=deerkha_login:10m rate=10r/m;

upstream deerkha_app {
    server 127.0.0.1:8000;
    keepalive 16;
}

# Shared proxy settings.
map $http_upgrade $connection_upgrade { default upgrade; '' close; }

# ---------------------------------------------------------------------------
# Redirect plain HTTP. certbot normally writes this itself; kept explicit so
# the config is readable as a whole.
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name admin.example.com app.example.com;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

# ---------------------------------------------------------------------------
# ADMIN HOST -- full dashboard, internal only.
# Strongly consider putting this behind Cloudflare Access or an IP allowlist
# as well. It has no reason to be reachable by the general internet.
# ---------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name admin.example.com;

    # ssl_certificate / ssl_certificate_key are filled in by certbot.

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;

    # Reference-frame uploads are camera stills; the app caps them at 8 MB.
    client_max_body_size 8m;

    location = /login {
        limit_req zone=deerkha_login burst=5 nodelay;
        proxy_pass http://deerkha_app;
        include /etc/nginx/deerkha-proxy.conf;
    }

    location / {
        proxy_pass http://deerkha_app;
        include /etc/nginx/deerkha-proxy.conf;
    }

    # MJPEG live streams are long-lived and must not be buffered, or the
    # operator sees nothing until nginx decides to flush.
    location ~ ^/api/live/.*/stream$ {
        proxy_pass http://deerkha_app;
        include /etc/nginx/deerkha-proxy.conf;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
}

# ---------------------------------------------------------------------------
# CLIENT HOST -- read-only customer dashboard, internet-facing.
# ---------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name app.example.com;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    # The client templates must not use inline <script>; see the client.js split.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; frame-ancestors 'none'" always;

    client_max_body_size 1m;   # clients upload nothing

    # --- HARD DENIES -------------------------------------------------------
    # ^~ so these win over any regex location. Everything a customer must never
    # reach, blocked at the edge regardless of what the app does.
    #   /api/admin/  -- config CRUD, device tokens, RTSP URLs, audit diffs
    #   /api/live/   -- admin live proxy incl. MJPEG; clients use /api/client/
    #   /device/     -- admin per-device config pages
    #   /api/config, /api/heartbeat -- the DEVICE API. Devices reach it over
    #                Tailscale, never through this public vhost.
    location ^~ /api/admin/    { return 404; }
    location ^~ /api/live/     { return 404; }
    location ^~ /device/       { return 404; }
    location ^~ /api/config    { return 404; }
    location ^~ /api/heartbeat { return 404; }
    location ^~ /api/ingest    { return 404; }
    location = /docs           { return 404; }
    location = /redoc          { return 404; }
    location = /openapi.json   { return 404; }

    location = /login {
        limit_req zone=deerkha_login burst=5 nodelay;
        proxy_pass http://deerkha_app;
        include /etc/nginx/deerkha-proxy.conf;
    }

    location / {
        proxy_pass http://deerkha_app;
        include /etc/nginx/deerkha-proxy.conf;
    }
}
