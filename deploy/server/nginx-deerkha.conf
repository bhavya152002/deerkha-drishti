# nginx for Deerkha Drishti -- the REAL config. It requires a certificate to
# already exist; install nginx-deerkha-bootstrap.conf first and read the header
# there for why.
#
#     # 1. bootstrap (HTTP only), so nginx starts and can answer ACME
#     sudo install -m 644 deploy/server/nginx-deerkha-bootstrap.conf \
#          /etc/nginx/sites-available/deerkha
#     sudo ln -sf /etc/nginx/sites-available/deerkha /etc/nginx/sites-enabled/
#     sudo nginx -t && sudo systemctl reload nginx
#
#     # 2. issue the certificate WITHOUT letting certbot edit nginx
#     sudo certbot certonly --webroot -w /var/www/html -d admin.visionlogix.io
#
#     # 3. swap in this file
#     sudo install -m 644 deploy/server/nginx-deerkha.conf \
#          /etc/nginx/sites-available/deerkha
#     sudo nginx -t && sudo systemctl reload nginx
#
# TWO HOSTNAMES, one app:
#   admin.visionlogix.io  -- full dashboard. Internal team only.
#   app.visionlogix.io    -- read-only client dashboard. Internet-facing.
#
# ###########################################################################
# app.visionlogix.io IS COMMENTED OUT BELOW, DELIBERATELY.
#
# The client dashboard does not exist yet. Until it does, that vhost proxies
# to the SAME application, so enabling it publishes the admin login page to
# the open internet, protected by one shared password. The path denies below
# are defence in depth, not a substitute for the client app.
#
# Enable it only when the client dashboard ships. At that point: add the DNS
# A record, uncomment the vhost, add app.visionlogix.io to the port-80
# server_name, and re-run certbot with both -d flags.
# ###########################################################################
#
# Both proxy to the same uvicorn on 127.0.0.1:8000, and the application's own
# role checks are the REAL access control. The per-host denies below are
# defence in depth: they make a future forgotten admin route unreachable from
# the customer's hostname even if its guard is wrong. Two locks, not one.
#
# After installing, verify the app is not reachable except through nginx:
#     curl --connect-timeout 5 http://<public-ip>:8000/healthz    # must TIME OUT

# Rate limit the login form. Per-IP only -- the per-username lockout lives in
# the application, because a botnet rotating source IPs walks straight past
# anything keyed on $binary_remote_addr.
limit_req_zone $binary_remote_addr zone=deerkha_login:10m rate=10r/m;

upstream deerkha_app {
    server 127.0.0.1:8000;
    keepalive 16;
}

# Shared proxy settings.
map $http_upgrade $connection_upgrade { default upgrade; '' close; }

# ---------------------------------------------------------------------------
# Redirect plain HTTP. certbot normally writes this itself; kept explicit so
# the config is readable as a whole.
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    # Add app.visionlogix.io here when the client dashboard ships.
    server_name admin.visionlogix.io;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

# ---------------------------------------------------------------------------
# ADMIN HOST -- full dashboard, internal only.
# Strongly consider putting this behind Cloudflare Access or an IP allowlist
# as well. It has no reason to be reachable by the general internet.
# ---------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name admin.visionlogix.io;

    # These paths must EXIST before this file is loaded, or nginx refuses to
    # start. Issue the certificate first with the bootstrap vhost:
    #   sudo certbot certonly --webroot -w /var/www/html -d admin.visionlogix.io
    # See nginx-deerkha-bootstrap.conf for why it is done in that order.
    ssl_certificate     /etc/letsencrypt/live/admin.visionlogix.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.visionlogix.io/privkey.pem;

    # TLS settings are spelled out here rather than via
    # `include /etc/letsencrypt/options-ssl-nginx.conf`. That file is written by
    # certbot's NGINX PLUGIN, which we deliberately do not use -- `certonly`
    # issues certificates and touches nothing else -- so it never exists and the
    # include fails with "No such file or directory".
    #
    # No ssl_dhparam either: the cipher list below is ECDHE-only, so the DH
    # parameters that directive points at are never used.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;

    # Reference-frame uploads are camera stills; the app caps them at 8 MB.
    client_max_body_size 8m;

    # Set at SERVER level, not in the shared proxy include, so the MJPEG stream
    # location below can legally override the read timeout. nginx permits a
    # directive once per context; server-level here, location-level there.
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    location = /login {
        limit_req zone=deerkha_login burst=5 nodelay;
        proxy_pass http://deerkha_app;
        include /etc/nginx/deerkha-proxy.conf;
    }

    location / {
        proxy_pass http://deerkha_app;
        include /etc/nginx/deerkha-proxy.conf;
    }

    # MJPEG live streams are long-lived and must not be buffered, or the
    # operator sees nothing until nginx decides to flush.
    location ~ ^/api/live/.*/stream$ {
        proxy_pass http://deerkha_app;
        include /etc/nginx/deerkha-proxy.conf;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
}

