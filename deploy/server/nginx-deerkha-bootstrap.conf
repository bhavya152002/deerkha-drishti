# Bootstrap vhost -- HTTP only, no TLS. Install to
# /etc/nginx/sites-available/deerkha BEFORE you have a certificate:
#
#     sudo install -m 644 deploy/server/nginx-deerkha-bootstrap.conf \
#          /etc/nginx/sites-available/deerkha
#     sudo ln -sf /etc/nginx/sites-available/deerkha /etc/nginx/sites-enabled/
#     sudo nginx -t && sudo systemctl reload nginx
#
# WHY THIS FILE EXISTS
# --------------------
# nginx-deerkha.conf declares `listen 443 ssl` and therefore requires
# ssl_certificate to exist. On a fresh box it does not, so `nginx -t` fails --
# and `certbot --nginx` shells out to `nginx -t` before doing anything. The full
# config cannot load until a certificate exists, and certbot cannot issue one
# while the full config is loaded. This file breaks that circle.
#
# Order:
#   1. this file           -> nginx serves :80 and answers ACME challenges
#   2. certbot certonly    -> writes /etc/letsencrypt/live/<host>/
#   3. nginx-deerkha.conf  -> the real config, cert paths already correct
#
# `certonly --webroot` is deliberate rather than `--nginx`: it only writes
# certificates and never edits nginx configuration, so the reviewed config in
# git stays the config that runs. certbot's auto-edits would otherwise silently
# diverge from the repo, and the security headers and path denies in the real
# config would not survive a regeneration.

upstream deerkha_app_bootstrap {
    server 127.0.0.1:8000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name admin.visionlogix.io;

    # certbot --webroot writes its challenge token here.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Serving the app over plain HTTP is acceptable ONLY during this bootstrap
    # window. The session cookie is Secure, so login will not work over http --
    # that is expected and is why this is a temporary state, not a fallback.
    location / {
        proxy_pass http://deerkha_app_bootstrap;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }
}
